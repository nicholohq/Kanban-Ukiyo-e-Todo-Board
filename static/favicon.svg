<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sakura blossom">
	<rect width="64" height="64" rx="13" fill="#1a2a3a" />
	<defs>
		<!-- One sakura petal pointing up, with a notched tip, base at flower centre (32,32). -->
		<path
			id="petal"
			d="M32 32
			   C 26.5 30 23.5 24 24 18
			   C 24.3 14 27 11.2 30 12.8
			   C 31 13.4 31.4 14.2 32 15.6
			   C 32.6 14.2 33 13.4 34 12.8
			   C 37 11.2 39.7 14 40 18
			   C 40.5 24 37.5 30 32 32 Z"
			fill="#f4b3cb"
			stroke="#c41a1a"
			stroke-width="1.4"
			stroke-linejoin="round"
		/>
	</defs>
	<g>
		<use href="#petal" />
		<use href="#petal" transform="rotate(72 32 32)" />
		<use href="#petal" transform="rotate(144 32 32)" />
		<use href="#petal" transform="rotate(216 32 32)" />
		<use href="#petal" transform="rotate(288 32 32)" />
	</g>
	<!-- Stamen centre -->
	<circle cx="32" cy="32" r="4.4" fill="#c5a059" stroke="#c41a1a" stroke-width="1.2" />
	<circle cx="32" cy="27.6" r="1.1" fill="#c41a1a" />
	<circle cx="36.2" cy="30.6" r="1.1" fill="#c41a1a" />
	<circle cx="34.6" cy="35.4" r="1.1" fill="#c41a1a" />
	<circle cx="29.4" cy="35.4" r="1.1" fill="#c41a1a" />
	<circle cx="27.8" cy="30.6" r="1.1" fill="#c41a1a" />
</svg>
